onboarding = false

[keys]
prefix = "ctrl+a"
reload_config = "prefix+shift+r"
resize_mode = "prefix+r"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[theme]
name = "gruvbox"
auto_switch = false

[ui]
mouse_capture = true
copy_on_select = true
tab_bar_position = "bottom"
pane_borders = "auto"
pane_scrollbars = false
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%a %Y-%m-%d %H:%M" },
]

status_indicators = "symbols"
[advanced]
scrollback_limit_bytes = 10000000

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "Navigate left (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "Navigate down (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "Navigate up (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "Navigate right (Neovim/Herdr)"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Resize left (Neovim/Herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Resize down (Neovim/Herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Resize up (Neovim/Herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Resize right (Neovim/Herdr)"

[ui.sound]
enabled = false
